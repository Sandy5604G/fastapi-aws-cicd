services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: local-dev
    ports:
      - "8000:8000"
    environment:
      - APP_VERSION=local-dev
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
